name: Julia CI

on:
  push: {branches: [main,master], tags: ['**']}
  pull_request: {types: [opened,synchronize,reopened,ready_for_review,converted_to_draft]}
  issue_comment: {types: [created]}
  workflow_dispatch:
    inputs:
      feature:
        type: choice
        description: What to run
        options: [DocDeploy, LintAndTest, TagBot]

jobs:
  julia-ci:
    uses: franckgaga/testitem-workflow/.github/workflows/juliaci.yml@patch-1
    with:
      include-windows-x86: false    # not worth it, windows 32bit is too uncommon
      include-macos-x64: false      # most mac are aarch64 nowadays
      include-linux-x86: false      # would like to include it, but too unreliable for now
    permissions: write-all
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}